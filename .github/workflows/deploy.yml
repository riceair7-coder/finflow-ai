name: Deploy

on:
  push:
    branches:
      - main        # → prod
      - develop     # → staging
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options: [staging, prod]

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com

jobs:
  # ─────────────────────────────────────────────
  # 1. 테스트
  # ─────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: finflow_test
          POSTGRES_USER: finflow
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api-gateway/requirements.txt

      - name: Install dependencies
        working-directory: api-gateway
        run: pip install -r requirements.txt

      - name: Lint
        working-directory: api-gateway
        run: ruff check app/

      - name: Test
        working-directory: api-gateway
        env:
          DATABASE_URL: postgresql+asyncpg://finflow:test_password@localhost:5432/finflow_test
          DATABASE_SYNC_URL: postgresql://finflow:test_password@localhost:5432/finflow_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-only-32chars
          ENVIRONMENT: test
        run: pytest tests/ -v --tb=short

  # ─────────────────────────────────────────────
  # 2. 이미지 빌드 & ECR 푸시
  # ─────────────────────────────────────────────
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    outputs:
      api_image: ${{ steps.meta_api.outputs.tags }}
      ai_image:  ${{ steps.meta_ai.outputs.tags }}
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "tag=$(echo $GITHUB_SHA | head -c8)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push API image
        id: meta_api
        env:
          REPO: ${{ env.ECR_REGISTRY }}/finflow-${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}-api
          TAG:  ${{ steps.tag.outputs.tag }}
        run: |
          docker build -t $REPO:$TAG -t $REPO:latest ./api-gateway
          docker push $REPO:$TAG
          docker push $REPO:latest
          echo "tags=$REPO:$TAG" >> $GITHUB_OUTPUT

      - name: Build & push AI Engine image
        id: meta_ai
        env:
          REPO: ${{ env.ECR_REGISTRY }}/finflow-${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}-ai-engine
          TAG:  ${{ steps.tag.outputs.tag }}
        run: |
          docker build -t $REPO:$TAG -t $REPO:latest ./services/ai-engine
          docker push $REPO:$TAG
          docker push $REPO:latest
          echo "tags=$REPO:$TAG" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────
  # 3. DB 마이그레이션
  # ─────────────────────────────────────────────
  migrate:
    name: Migrate DB
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Run Alembic migration via ECS RunTask
        env:
          ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
        run: |
          CLUSTER="finflow-${ENV}"
          TASK_DEF="finflow-${ENV}-api"
          SUBNETS="${{ secrets.PRIVATE_SUBNET_IDS }}"
          SG="${{ secrets.ECS_SG_ID }}"

          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"api","command":["alembic","upgrade","head"]}]}' \
            --query 'tasks[0].taskArn' --output text)

          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed with exit code $EXIT_CODE"
            exit 1
          fi
          echo "Migration succeeded"

  # ─────────────────────────────────────────────
  # 4. ECS 배포
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: [build, migrate]
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Deploy API to ECS
        env:
          ENV:       ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
          API_IMAGE: ${{ needs.build.outputs.api_image }}
        run: |
          CLUSTER="finflow-${ENV}"
          SERVICE="finflow-${ENV}-api"
          TASK_DEF="finflow-${ENV}-api"

          # 현재 태스크 정의를 가져와 이미지만 교체
          CURRENT=$(aws ecs describe-task-definition --task-definition "$TASK_DEF" --query taskDefinition)
          NEW=$(echo "$CURRENT" | jq \
            --arg img "$API_IMAGE" \
            '.containerDefinitions[0].image = $img
             | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW" \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --task-definition "$NEW_ARN"

          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "$SERVICE"

          echo "Deployment complete: $NEW_ARN"

      - name: Notify Slack on success
        if: success()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK" \
            -H 'Content-type: application/json' \
            -d "{\"text\":\"✅ FinFlow *${ENV}* 배포 완료 — \`${{ needs.build.outputs.image_tag }}\`\"}"

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK" \
            -H 'Content-type: application/json' \
            -d "{\"text\":\"❌ FinFlow *${ENV}* 배포 실패 — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|로그 확인>\"}"
