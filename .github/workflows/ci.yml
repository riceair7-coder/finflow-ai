name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: finflow_test
          POSTGRES_USER: finflow
          POSTGRES_PASSWORD: finflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api-gateway/requirements.txt

      - name: Install dependencies
        working-directory: api-gateway
        run: pip install -r requirements.txt

      - name: Lint with ruff
        working-directory: api-gateway
        run: ruff check app/

      - name: Run tests
        working-directory: api-gateway
        env:
          DATABASE_URL: postgresql+asyncpg://finflow:finflow_test@localhost:5432/finflow_test
          DATABASE_SYNC_URL: postgresql://finflow:finflow_test@localhost:5432/finflow_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-pipeline-only
          ENVIRONMENT: test
        run: pytest tests/ -v --tb=short

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -t finflow-api:test ./api-gateway
