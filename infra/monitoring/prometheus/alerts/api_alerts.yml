groups:
  - name: finflow_api
    rules:
      - alert: APIHighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API 오류율 5% 초과"
          description: "5분간 오류율: {{ $value | humanizePercentage }}"

      - alert: APIHighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API P95 지연시간 2초 초과"
          description: "P95: {{ $value }}s"

      - alert: APIDown
        expr: up{job="finflow-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API 서버 다운"

      - alert: DBConnectionsHigh
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL 연결 수 80 초과"
