global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: "finflow"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alerts/*.yml"

scrape_configs:
  - job_name: "finflow-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: "finflow-ai-engine"
    static_configs:
      - targets: ["ai-engine:8001"]
    metrics_path: /metrics

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "celery"
    static_configs:
      - targets: ["celery-worker:9540"]
